<div class="header">
    <h1>Renewable Energy Map</h1>
    <p>Click a bubble to learn about each renewable energy source.</p>
</div>

<div class="bubble-map">

    <div class="bubble solar" onclick="showInfo('solar')">
        ☀️
        <span>Solar</span>
    </div>

    <div class="bubble wind" onclick="showInfo('wind')">
        💨
        <span>Wind</span>
    </div>

    <div class="bubble main">
        🌍
        <span>Renewable Energy</span>
    </div>

    <div class="bubble hydro" onclick="showInfo('hydro')">
        💧
        <span>Hydro</span>
    </div>

    <div class="bubble geo" onclick="showInfo('geo')">
        🌋
        <span>Geothermal</span>
    </div>

    <div class="bubble biomass" onclick="showInfo('biomass')">
        🌿
        <span>Biomass</span>
    </div>
</div>

<div class="info-box">
    <h2 id="energy-title">
        Click a Bubble
    </h2>
    <p id="description">
        Select one of the renewable energy sources above.
    </p>
</div>
<script src="energy.js"></script>
